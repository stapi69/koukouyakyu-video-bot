<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0a2e1a;
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }
    .slide {
      width: 1080px; height: 1920px;
      position: absolute; top: 0; left: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0;
    }
    #slide-opening {
      background: linear-gradient(160deg, #0a2e1a 0%, #1a5c34 100%);
    }
    .channel-name {
      font-size: 72px; font-weight: 900;
      color: #FFD700; text-align: center;
      text-shadow: 0 4px 20px rgba(255,215,0,0.5);
      line-height: 1.3;
    }
    .date-label {
      font-size: 48px; color: #ffffff;
      margin-top: 40px; opacity: 0.85;
    }
    .subtitle {
      font-size: 40px; color: #88ccaa;
      margin-top: 20px;
    }
    .slide-game {
      background: linear-gradient(160deg, #0a2e1a 0%, #1a5c34 100%);
    }
    .tournament-label {
      font-size: 36px; color: #FFD700;
      letter-spacing: 4px; margin-bottom: 60px;
    }
    .matchup {
      width: 90%;
      display: flex; align-items: center; justify-content: center;
      gap: 30px;
    }
    .team-block {
      display: flex; flex-direction: column;
      align-items: center; gap: 0; flex: 1;
    }
    .team-name {
      font-size: 56px; font-weight: 900;
      color: #ffffff; text-align: center;
      line-height: 1.2;
      min-height: 180px;
      display: flex; align-items: center; justify-content: center;
    }
    .score {
      font-size: 160px; font-weight: 900;
      color: #FFD700;
      text-shadow: 0 0 40px rgba(255,215,0,0.6);
      line-height: 1;
    }
    .vs-label {
      font-size: 56px; color: #88ccaa;
      font-weight: 700;
      flex-shrink: 0;
      align-self: flex-end;
      padding-bottom: 20px;
    }
    .win-badge {
      font-size: 32px; background: #FFD700;
      color: #0a2e1a; padding: 8px 24px;
      border-radius: 30px; font-weight: 900;
    }
    #slide-ending {
      background: linear-gradient(160deg, #0a2e1a 0%, #1a5c34 100%);
    }
    .ending-text {
      font-size: 56px; color: #FFD700;
      font-weight: 900; text-align: center;
    }
    .ending-sub {
      font-size: 38px; color: #88ccaa;
      margin-top: 30px; text-align: center;
    }
    .slide-counter {
      position: absolute; bottom: 80px;
      font-size: 32px; color: rgba(255,255,255,0.4);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<!-- オープニングスライド -->
<div class="slide" id="slide-opening">
  <div class="channel-name">高校野球速報<br>ダイジェスト</div>
  <div class="date-label">{{DATE}}</div>
  <div class="subtitle">本日の試合結果</div>
</div>

<!-- 試合スライド（build-composition.jsが生成） -->
{{GAME_SLIDES}}

<!-- エンディングスライド -->
<div class="slide" id="slide-ending">
  <div class="ending-text">本日も熱戦<br>ありがとうございました！</div>
  <div class="ending-sub">チャンネル登録・いいねお願いします ⚾</div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const durations = [2, {{GAME_DURATIONS}}, 2];

  const tl = gsap.timeline();
  slides.forEach((slide, i) => {
    tl.to(slide, { opacity: 1, duration: 0.3 })
      .to(slide, { opacity: 1, duration: durations[i] - 0.6 })
      .to(slide, { opacity: 0, duration: 0.3 });
  });
</script>
</body>
</html>
