<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>koshien-shorts</title>
<style>
  :root {
    --green: #1B5E3D;
    --white: #FFFFFF;
    --gold: #FFD447;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }

  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--green); }

  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* --- Scene 1: 大会名タイトル --- */
  #scene-title .tournament {
    font-size: 64px; font-weight: 700; color: var(--white); text-align: center;
    padding: 0 80px; opacity: 0; transform: translateY(40px);
  }
  #scene-title .sub {
    margin-top: 24px; font-size: 36px; color: var(--gold); opacity: 0;
  }

  /* --- Scene 2: 対戦カード＋スコア --- */
  #scene-score .card {
    width: 900px; background: var(--white); border-radius: 32px; padding: 64px 40px;
    display: flex; flex-direction: column; align-items: center; opacity: 0; transform: scale(0.9);
  }
  #scene-score .teams { display: flex; align-items: center; justify-content: center; gap: 40px; }
  #scene-score .team { font-size: 56px; font-weight: 700; color: var(--green); text-align: center; width: 320px; }
  #scene-score .score { font-size: 96px; font-weight: 900; color: var(--green); }
  #scene-score .vs { font-size: 40px; color: #999; margin: 24px 0; }

  /* --- Scene 3: 勝敗コメント --- */
  #scene-result .winner {
    font-size: 72px; font-weight: 900; color: var(--gold); text-align: center; padding: 0 60px; opacity: 0;
  }
  #scene-result .ball { font-size: 120px; opacity: 0; }
  #scene-result .hashtags {
    margin-top: 40px; font-size: 32px; color: var(--white); opacity: 0; text-align: center; padding: 0 60px;
  }
</style>
</head>
<body>

<div id="root"
     data-composition-id="koshien-shorts"
     data-width="1080"
     data-height="1920">

  <!-- Scene 1: 大会名 (0s - 3s) -->
  <div id="scene-title" class="scene clip"
       data-start="0" data-duration="3" data-track-index="0">
    <div class="scene-content" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div class="tournament">{{TOURNAMENT}}</div>
      <div class="sub">⚾ 高校野球速報</div>
    </div>
  </div>

  <!-- Scene 2: スコアカード (2.5s - 6.5s、少し重ねてクロスフェード) -->
  <div id="scene-score" class="scene clip"
       data-start="2.5" data-duration="4" data-track-index="0">
    <div class="scene-content" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
      <div class="card">
        <div class="teams">
          <div class="team">{{TEAM_A}}</div>
          <div class="score">{{SCORE_A}}</div>
        </div>
        <div class="vs">-</div>
        <div class="teams">
          <div class="team">{{TEAM_B}}</div>
          <div class="score">{{SCORE_B}}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scene 3: 勝敗コメント＋タグ (6s - 9s) -->
  <div id="scene-result" class="scene clip"
       data-start="6" data-duration="3" data-track-index="0">
    <div class="scene-content" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div class="ball">⚾</div>
      <div class="winner">{{WINNER}} が {{WIN_SCORE}}-{{LOSE_SCORE}} で勝利！</div>
      <div class="hashtags">{{HASHTAGS}}</div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};

  function buildTimeline() {
    const tl = gsap.timeline({ paused: true });

    tl.to('#scene-title .tournament', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 0.1)
      .to('#scene-title .sub', { opacity: 1, duration: 0.5 }, 0.4)
      .to('#scene-title', { opacity: 0, duration: 0.5 }, 2.4);

    tl.to('#scene-score .card', { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.7)' }, 2.6)
      .to('#scene-score', { opacity: 0, duration: 0.5 }, 6.0);

    tl.fromTo('#scene-result .ball', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)' }, 6.1)
      .to('#scene-result .winner', { opacity: 1, duration: 0.6 }, 6.4)
      .to('#scene-result .hashtags', { opacity: 1, duration: 0.6 }, 7.0);

    return tl;
  }

  window.__timelines['koshien-shorts'] = buildTimeline();
</script>
</body>
</html>
