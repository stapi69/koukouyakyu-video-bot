name: Render and Upload Koshien Short

on:
  repository_dispatch:
    types: [new-game, new-games-digest]
  workflow_dispatch:
    inputs:
      teamA:
        description: "チームA"
        required: true
        default: "サンプル高校"
      scoreA:
        description: "スコアA"
        required: true
        default: "5"
      teamB:
        description: "チームB"
        required: true
        default: "テスト高校"
      scoreB:
        description: "スコアB"
        required: true
        default: "3"
      tournament:
        description: "大会名"
        required: true
        default: "選手権テスト大会"

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: FFmpeg・TTS依存関係をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk espeak-ng
          pip install gtts edge-tts --break-system-packages

      - name: 依存パッケージをインストール
        run: npm install

      - name: Puppeteerの依存ライブラリをインストール
        run: |
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: game.jsonを生成
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJSON(github.event.client_payload) }}' > game.json
          else
            echo '{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}","games":[{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}"}],"date":"${{ inputs.tournament }}"}' > game.json
          fi

      - name: ナレーション音声を生成
        run: |
          mkdir -p narration
          python3 << 'PYEOF'
          import json, subprocess, os, sys, asyncio

          with open('game.json') as f:
              d = json.load(f)
          games = d.get('games', [])
          date = d.get('date', '')

          texts = [
              (f"{date}の高校野球、試合結果ダイジェストです。", 'narration/opening'),
          ]
          for i, g in enumerate(games):
              winner = g['teamA'] if g['scoreA'] > g['scoreB'] else g['teamB']
              t = f"{g['tournament']}。{g['teamA']} {g['scoreA']}対{g['scoreB']} {g['teamB']}。{winner}が勝利しました。"
              texts.append((t, f'narration/game{i}'))
          texts.append(('チャンネル登録よろしくお願いします。', 'narration/ending'))

          def make_silent(filepath, duration=3):
              subprocess.run(['ffmpeg', '-y', '-f', 'lavfi', '-i',
                  f'anullsrc=r=22050:cl=mono', '-t', str(duration), filepath],
                  capture_output=True)

          def try_gtts(text, filepath):
              try:
                  from gtts import gTTS
                  tts = gTTS(text=text, lang='ja', slow=False)
                  mp3 = filepath + '.mp3'
                  tts.save(mp3)
                  size = os.path.getsize(mp3)
                  if size < 1000:
                      return False
                  subprocess.run(['ffmpeg', '-y', '-i', mp3, '-ar', '22050', '-ac', '1', filepath],
                      capture_output=True)
                  return os.path.getsize(filepath) > 5000
              except Exception as e:
                  print(f"gTTS error: {e}")
                  return False

          async def try_edge_tts(text, filepath):
              try:
                  import edge_tts
                  mp3 = filepath + '_edge.mp3'
                  communicate = edge_tts.Communicate(text, "ja-JP-NanamiNeural")
                  await communicate.save(mp3)
                  size = os.path.getsize(mp3)
                  if size < 1000:
                      return False
                  subprocess.run(['ffmpeg', '-y', '-i', mp3, '-ar', '22050', '-ac', '1', filepath],
                      capture_output=True)
                  return os.path.getsize(filepath) > 5000
              except Exception as e:
                  print(f"edge-tts error: {e}")
                  return False

          def try_espeak(text, filepath):
              with open('/tmp/esp_text.txt', 'w', encoding='utf-8') as f:
                  f.write(text)
              result = subprocess.run(
                  ['espeak-ng', '-v', 'ja', '-s', '130', '-f', '/tmp/esp_text.txt', '-w', filepath],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  return False
              size = os.path.getsize(filepath) if os.path.exists(filepath) else 0
              return size > 5000  # 5KB以上なら有効

          success_count = 0
          for text, outbase in texts:
              outfile = outbase + '.wav'
              print(f"生成中: {text[:30]}...")
              ok = False

              # 1. gTTS試行
              if not ok:
                  ok = try_gtts(text, outfile)
                  if ok:
                      print(f"  ✅ gTTS成功: {os.path.getsize(outfile)} bytes")

              # 2. edge-tts試行
              if not ok:
                  try:
                      ok = asyncio.run(try_edge_tts(text, outfile))
                      if ok:
                          print(f"  ✅ edge-tts成功: {os.path.getsize(outfile)} bytes")
                  except Exception as e:
                      print(f"  edge-tts: {e}")

              # 3. espeak-ng試行
              if not ok:
                  ok = try_espeak(text, outfile)
                  if ok:
                      print(f"  ✅ espeak-ng成功: {os.path.getsize(outfile)} bytes")

              # 4. フォールバック（無音）
              if not ok:
                  print(f"  ⚠️ 全TTS失敗 → 無音フォールバック")
                  make_silent(outfile)
              else:
                  success_count += 1

          print(f"ナレーション成功: {success_count}/{len(texts)}")

          # 結合
          files = [t[1] + '.wav' for t in texts if os.path.exists(t[1] + '.wav')]
          with open('narration/list.txt', 'w') as f:
              f.write('\n'.join([f"file '{fn}'" for fn in files]))

          result = subprocess.run(
              ['ffmpeg', '-f', 'concat', '-safe', '0', '-i', 'narration/list.txt', '-c', 'copy', 'narration/combined.wav', '-y'],
              capture_output=True
          )
          if result.returncode == 0:
              size = os.path.getsize('narration/combined.wav')
              print(f"✅ combined.wav: {size} bytes (success={success_count})")
          else:
              print(f"❌ 結合失敗: {result.stderr.decode()}")
          PYEOF

      - name: コンポジションHTMLを生成
        run: node scripts/build-composition.js

      - name: Puppeteerで動画レンダリング
        run: node scripts/render-video.js

      - name: BGMをミックス
        run: node scripts/mix-audio.js

      - name: output_final.mp4を確実に生成
        run: |
          if [ ! -f output_final.mp4 ] && [ -f output.mp4 ]; then
            cp output.mp4 output_final.mp4
          fi
          test -f output_final.mp4 || (echo "FATAL: no output_final.mp4" && exit 1)
          ls -la output_final.mp4

      - name: YouTube OAuth トークン確認
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/tok.json -w "%{http_code}" -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YOUTUBE_CLIENT_ID}" \
            -d client_secret="${YOUTUBE_CLIENT_SECRET}" \
            -d refresh_token="${YOUTUBE_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)
          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/tok.json && exit 1
          fi
          echo "TOKEN OK"

      - name: YouTube Shortsにアップロード
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.js

      - name: 動画をArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: koshien-short
          path: output_final.mp4
          retention-days: 7
