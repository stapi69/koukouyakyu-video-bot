name: Render and Upload Koshien Short

on:
  repository_dispatch:
    types: [new-game, new-games-digest]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'アップロードをスキップ（テスト用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      teamA:
        description: "チームA"
        required: true
        default: "サンプル高校"
      scoreA:
        description: "スコアA"
        required: true
        default: "5"
      teamB:
        description: "チームB"
        required: true
        default: "テスト高校"
      scoreB:
        description: "スコアB"
        required: true
        default: "3"
      tournament:
        description: "大会名"
        required: true
        default: "選手権テスト大会"

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm install
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: game.jsonを生成
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJSON(github.event.client_payload) }}' > game.json
          else
            echo '{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}","games":[{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}"}],"date":"${{ inputs.tournament }}"}' > game.json
          fi

      - name: コンポジションHTMLを生成
        run: node scripts/build-composition.js

      - name: Puppeteerで動画レンダリング
        run: node scripts/render-video.js

      - name: BGMをミックス
        run: node scripts/mix-audio.js

      - name: output_final.mp4を確実に生成
        run: |
          if [ ! -f output_final.mp4 ] && [ -f output.mp4 ]; then
            cp output.mp4 output_final.mp4
          fi
          test -f output_final.mp4 || (echo "FATAL: no output_final.mp4" && exit 1)

      - name: YouTube Shortsにアップロード
        if: inputs.dry_run != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.js

      - name: 動画をArtifactとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koshien-short-${{ github.run_number }}
          path: output_final.mp4
          retention-days: 7

      - name: 失敗通知（LINE Notify）
        if: failure()
        continue-on-error: true
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: |
          if [ -n "${LINE_NOTIFY_TOKEN}" ]; then
            curl -s -X POST https://notify-api.line.me/api/notify \
              -H "Authorization: Bearer ${LINE_NOTIFY_TOKEN}" \
              --data-urlencode "message=❌ 高校野球ボット失敗
Run #${{ github.run_number }} / ${{ github.workflow }}
https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "LINE_NOTIFY_TOKEN 未設定のため通知スキップ"
          fi
