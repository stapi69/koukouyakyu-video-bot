name: Render and Upload Koshien Short

on:
  repository_dispatch:
    types: [new-game, new-games-digest]
  workflow_dispatch:
    inputs:
      teamA:
        description: "チームA"
        required: true
        default: "サンプル高校"
      scoreA:
        description: "スコアA"
        required: true
        default: "5"
      teamB:
        description: "チームB"
        required: true
        default: "テスト高校"
      scoreB:
        description: "スコアB"
        required: true
        default: "3"
      tournament:
        description: "大会名"
        required: true
        default: "選手権テスト大会"

jobs:
  build-video:
    runs-on: ubuntu-latest

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu22.04-0.25.2
        ports:
          - 50021:50021

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install pykakasi --break-system-packages -q
          npm install
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: game.jsonを生成
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJSON(github.event.client_payload) }}' > game.json
          else
            echo '{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}","games":[{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}"}],"date":"${{ inputs.tournament }}"}' > game.json
          fi

      - name: VoiceVox起動待機＋日本語テスト
        run: |
          for i in $(seq 1 48); do
            AQ=$(curl -s -X POST "http://localhost:50021/audio_query?text=test&speaker=3" 2>/dev/null)
            if echo "$AQ" | grep -q "accent_phrases"; then
              echo "VoiceVox ASCII OK (${i})"
              AQ2=$(curl -s -X POST "http://localhost:50021/audio_query?text=%E3%82%AA%E3%82%AA%E3%82%B5%E3%82%AB%E3%83%88%E3%82%A6%E3%82%A4%E3%83%B3&speaker=3" 2>/dev/null)
              echo "JP_AQ_len=${#AQ2} has_accent=$(echo $AQ2 | grep -c accent_phrases)"
              SZ2=$(echo "$AQ2" | curl -s -X POST "http://localhost:50021/synthesis?speaker=3" -H "Content-Type: application/json" -d @- 2>/dev/null | wc -c)
              echo "JP_synthesis_size=$SZ2"
              break
            fi
            sleep 5
          done

      - name: ナレーション生成（bash直接）
        continue-on-error: true
        run: |
          mkdir -p narration
          python3 scripts/generate_narration.py
          COUNT=$(cat /tmp/vv_texts/count.txt 2>/dev/null || echo 0)
          echo "テキスト数: $COUNT"
          for i in $(seq 0 $((COUNT-1))); do
            IDX=$(printf '%02d' $i)
            KANA=$(cat /tmp/vv_texts/${IDX}_kana.txt 2>/dev/null || echo "")
            WAV=$(cat /tmp/vv_texts/${IDX}_wav.txt 2>/dev/null || echo "narration/${IDX}.wav")
            DUR=$(cat /tmp/vv_texts/${IDX}_dur.txt 2>/dev/null || echo "3")
            ENC=$(python3 -c "from urllib.parse import quote; import sys; print(quote(sys.stdin.read().strip(),safe=''))" <<< "$KANA")
            echo "[${IDX}] ENC_len=${#ENC}"
            AQ=$(curl -s --max-time 30 -X POST "http://localhost:50021/audio_query?text=${ENC}&speaker=3" 2>/dev/null)
            echo "[${IDX}] AQ_len=${#AQ} has_accent=$(echo $AQ | grep -c accent_phrases)"
            if echo "$AQ" | grep -q "accent_phrases"; then
              echo "$AQ" | curl -s --max-time 600 -X POST "http://localhost:50021/synthesis?speaker=3" \
                -H "Content-Type: application/json" -d @- -o "$WAV" 2>/dev/null
              SZ=$(wc -c < "$WAV" 2>/dev/null || echo 0)
              echo "[${IDX}] WAV=$SZ bytes"
              [ "$SZ" -gt 1000 ] && echo "[${IDX}] ✅" && continue
            fi
            ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t "$DUR" "$WAV" -loglevel quiet 2>/dev/null
            echo "[${IDX}] → 無音"
          done
          ls narration/*.wav 2>/dev/null | sort | while IFS= read -r f; do echo "file '$f'"; done > narration/list.txt
          ffmpeg -f concat -safe 0 -i narration/list.txt -c copy narration/combined.wav -y -loglevel quiet 2>/dev/null || \
            ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t 10 narration/combined.wav -loglevel quiet 2>/dev/null
          echo "combined.wav: $(wc -c < narration/combined.wav 2>/dev/null || echo 0) bytes"

      - name: コンポジションHTMLを生成
        run: node scripts/build-composition.js

      - name: Puppeteerで動画レンダリング
        run: node scripts/render-video.js

      - name: BGMをミックス
        run: node scripts/mix-audio.js

      - name: output_final.mp4を確実に生成
        run: |
          if [ ! -f output_final.mp4 ] && [ -f output.mp4 ]; then
            cp output.mp4 output_final.mp4
          fi
          test -f output_final.mp4 || (echo "FATAL: no output_final.mp4" && exit 1)

      - name: YouTube OAuth トークン確認
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/tok.json -w "%{http_code}" -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YOUTUBE_CLIENT_ID}" \
            -d client_secret="${YOUTUBE_CLIENT_SECRET}" \
            -d refresh_token="${YOUTUBE_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)
          [ "$HTTP_CODE" = "200" ] || (cat /tmp/tok.json && exit 1)
          echo "TOKEN OK"

      - name: YouTube Shortsにアップロード
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.js

      - name: 動画をArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: koshien-short
          path: output_final.mp4
          retention-days: 7

