name: Render and Upload Koshien Short


on:
  repository_dispatch:
    types: [new-game, new-games-digest]
  workflow_dispatch:
    inputs:
      teamA:
        description: "チームA"
        required: true
        default: "サンプル高校"
      scoreA:
        description: "スコアA"
        required: true
        default: "5"
      teamB:
        description: "チームB"
        required: true
        default: "テスト高校"
      scoreB:
        description: "スコアB"
        required: true
        default: "3"
      tournament:
        description: "大会名"
        required: true
        default: "選手権テスト大会"


jobs:
  build-video:
    runs-on: ubuntu-latest


    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
