name: Render and Upload Koshien Short

on:
  repository_dispatch:
    types: [new-game, new-games-digest]
  workflow_dispatch:
    inputs:
      teamA:
        description: "チームA"
        required: true
        default: "サンプル高校"
      scoreA:
        description: "スコアA"
        required: true
        default: "5"
      teamB:
        description: "チームB"
        required: true
        default: "テスト高校"
      scoreB:
        description: "スコアB"
        required: true
        default: "3"
      tournament:
        description: "大会名"
        required: true
        default: "選手権テスト大会"

jobs:
  build-video:
    runs-on: ubuntu-latest

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm install
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: game.jsonを生成
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJSON(github.event.client_payload) }}' > game.json
          else
            echo '{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}","games":[{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}"}],"date":"${{ inputs.tournament }}"}' > game.json
          fi

      - name: VoiceVox起動待機
        run: |
          for i in $(seq 1 48); do
            AQ=$(curl -s -X POST "http://localhost:50021/audio_query?text=%E3%83%86%E3%82%B9%E3%83%88&speaker=3" 2>/dev/null)
            if echo "$AQ" | grep -q "accent_phrases"; then
              SZ=$(echo "$AQ" | curl -s -X POST "http://localhost:50021/synthesis?speaker=3" \
                -H "Content-Type: application/json" -d @- 2>/dev/null | wc -c)
              if [ "$SZ" -gt 1000 ]; then
                echo "VoiceVox synthesis ready! (${i})"
                echo "=== 漢字テキストテスト ==="
                AQ2=$(curl -s -X POST "http://localhost:50021/audio_query?text=%E9%AB%98%E6%A0%A1%E9%87%8E%E7%90%83%E8%A9%A6%E5%90%88%E7%B5%90%E6%9E%9C%E3%81%A7%E3%81%99&speaker=3" 2>/dev/null)
                echo "漢字AQ_len=${#AQ2}"
                SZ2=$(echo "$AQ2" | curl -s -X POST "http://localhost:50021/synthesis?speaker=3" \
                  -H "Content-Type: application/json" -d @- 2>/dev/null | wc -c)
                echo "漢字synthesis_size=${SZ2}"
                break
              fi
            fi
            sleep 5
          done

      - name: ナレーション音声を生成
        continue-on-error: true
        run: |
          python3 scripts/generate_narration.py
          test -f narration/combined.wav || \
            ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t 10 narration/combined.wav -loglevel quiet

      - name: コンポジションHTMLを生成
        run: node scripts/build-composition.js

      - name: Puppeteerで動画レンダリング
        run: node scripts/render-video.js

      - name: BGMをミックス
        run: node scripts/mix-audio.js

      - name: output_final.mp4を確実に生成
        run: |
          if [ ! -f output_final.mp4 ] && [ -f output.mp4 ]; then
            cp output.mp4 output_final.mp4
          fi
          test -f output_final.mp4 || (echo "FATAL: no output_final.mp4" && exit 1)

      - name: YouTube OAuth トークン確認
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/tok.json -w "%{http_code}" -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YOUTUBE_CLIENT_ID}" \
            -d client_secret="${YOUTUBE_CLIENT_SECRET}" \
            -d refresh_token="${YOUTUBE_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)
          [ "$HTTP_CODE" = "200" ] || (cat /tmp/tok.json && exit 1)
          echo "TOKEN OK"

      - name: YouTube Shortsにアップロード
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.js

      - name: 動画をArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: koshien-short
          path: output_final.mp4
          retention-days: 7


