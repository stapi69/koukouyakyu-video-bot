name: Render and Upload Koshien Short

on:
  repository_dispatch:
    types: [new-game, new-games-digest]
  workflow_dispatch:
    inputs:
      teamA:
        description: "チームA"
        required: true
        default: "サンプル高校"
      scoreA:
        description: "スコアA"
        required: true
        default: "5"
      teamB:
        description: "チームB"
        required: true
        default: "テスト高校"
      scoreB:
        description: "スコアB"
        required: true
        default: "3"
      tournament:
        description: "大会名"
        required: true
        default: "選手権テスト大会"

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    outputs:
      token_updated: ${{ steps.exchange.outputs.token_updated }}
    steps:
      - name: Refresh Token交換・Secrets更新
        id: exchange
        env:
          YT_AUTH_CODE: ${{ secrets.YT_AUTH_CODE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET_FOR_GHA: ${{ secrets.YT_CLIENT_SECRET_FOR_GHA }}
          YT_REDIRECT_URI: ${{ secrets.YT_REDIRECT_URI }}
          PERSONAL_GH_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
        run: |
          RESP=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "code=${YT_AUTH_CODE}" \
            -d "client_id=${YT_CLIENT_ID}" \
            -d "client_secret=${YT_CLIENT_SECRET_FOR_GHA}" \
            -d "redirect_uri=${YT_REDIRECT_URI}" \
            -d "grant_type=authorization_code")
          echo "Exchange result:"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print({k:v for k,v in d.items() if k != 'access_token'})"
          REFRESH=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); rt=d.get('refresh_token',''); print(rt)" 2>/dev/null)
          if [ -z "$REFRESH" ]; then
            echo "Failed to get refresh token"
            echo "token_updated=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "::add-mask::$REFRESH"
          pip install PyNaCl --break-system-packages -q
          export RT_VALUE="$REFRESH"
          export GH_PAT="$PERSONAL_GH_TOKEN"
          python3 /dev/stdin << 'PYEOF'
import requests, base64, os
from nacl import encoding, public as nacl_public
RT = os.environ['RT_VALUE']
GH = os.environ['GH_PAT']
REPO = "stapi69/koukouyakyu-video-bot"
headers = {"Authorization": f"token {GH}", "Accept": "application/vnd.github.v3+json"}
pk = requests.get(f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=headers).json()
box = nacl_public.SealedBox(nacl_public.PublicKey(pk["key"].encode(), encoding.Base64Encoder()))
encrypted = base64.b64encode(box.encrypt(RT.encode())).decode()
r = requests.put(f"https://api.github.com/repos/{REPO}/actions/secrets/YOUTUBE_REFRESH_TOKEN",
    headers=headers, json={"encrypted_value": encrypted, "key_id": pk["key_id"]})
print("Secret updated:", r.status_code)
PYEOF
          echo "token_updated=true" >> $GITHUB_OUTPUT

  build-video:
    needs: refresh-token
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: FFmpeg・日本語フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: 依存パッケージをインストール
        run: npm install
      - name: Puppeteerの依存ライブラリをインストール
        run: |
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64
      - name: game.jsonを生成
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJSON(github.event.client_payload) }}' > game.json
          else
            echo '{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}","games":[{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}"}],"date":"${{ inputs.tournament }}"}' > game.json
          fi
      - name: ナレーション音声を生成
        run: |
          timeout 30 bash -c 'until curl -s http://localhost:50021/version; do sleep 2; done'
          node scripts/generate-narration.js
      - name: コンポジションHTMLを生成
        run: node scripts/build-composition.js
      - name: Puppeteerで動画レンダリング
        run: node scripts/render-video.js
      - name: BGMをミックス
        run: node scripts/mix-audio.js
      - name: output_final.mp4を確実に生成
        run: |
          if [ ! -f output_final.mp4 ] && [ -f output.mp4 ]; then
            cp output.mp4 output_final.mp4
          fi
          test -f output_final.mp4 || (echo "FATAL: no output_final.mp4" && exit 1)
      - name: YouTube Shortsにアップロード
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.js
      - name: 動画をArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: koshien-short
          path: output_final.mp4
          retention-days: 7
