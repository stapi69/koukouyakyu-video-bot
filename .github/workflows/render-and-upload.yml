name: Render and Upload Koshien Short

on:
  repository_dispatch:
    types: [new-game, new-games-digest]
  workflow_dispatch:
    inputs:
      teamA:
        description: "チームA"
        required: true
        default: "サンプル高校"
      scoreA:
        description: "スコアA"
        required: true
        default: "5"
      teamB:
        description: "チームB"
        required: true
        default: "テスト高校"
      scoreB:
        description: "スコアB"
        required: true
        default: "3"
      tournament:
        description: "大会名"
        required: true
        default: "選手権テスト大会"

jobs:
  build-video:
    runs-on: ubuntu-latest

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm install
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: game.jsonを生成
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJSON(github.event.client_payload) }}' > game.json
          else
            echo '{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}","games":[{"teamA":"${{ inputs.teamA }}","scoreA":${{ inputs.scoreA }},"teamB":"${{ inputs.teamB }}","scoreB":${{ inputs.scoreB }},"tournament":"${{ inputs.tournament }}"}],"date":"${{ inputs.tournament }}"}' > game.json
          fi

      - name: VoiceVox起動待機
        run: |
          for i in $(seq 1 48); do
            AQ=$(curl -s -X POST "http://localhost:50021/audio_query?text=test&speaker=3" 2>/dev/null)
            if echo "$AQ" | grep -q "accent_phrases"; then
              SZ=$(echo "$AQ" | curl -s -X POST "http://localhost:50021/synthesis?speaker=3" \
                -H "Content-Type: application/json" -d @- 2>/dev/null | wc -c)
              [ "$SZ" -gt 1000 ] && echo "VoiceVox ready! (${i})" && break
            fi
            sleep 5
          done

      - name: ナレーション音声を生成（bash直接）
        continue-on-error: true
        run: |
          mkdir -p narration

          # VoiceVox合成関数（起動確認と同じcurlを使用）
          vv_synth() {
            local TEXT="$1" OUT="$2" DUR="${3:-3}"
            # URLエンコード
            local ENC
            ENC=$(python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(),safe=''))" <<< "$TEXT")
            # audio_query
            local AQ
            AQ=$(curl -s --max-time 60 -X POST "http://localhost:50021/audio_query?text=${ENC}&speaker=3" 2>/dev/null)
            echo "  [${OUT}] AQ_len=${#AQ}"
            if echo "$AQ" | grep -q "accent_phrases"; then
              # synthesis
              echo "$AQ" | curl -s --max-time 300 -X POST "http://localhost:50021/synthesis?speaker=3" \
                -H "Content-Type: application/json" -d @- -o "$OUT" 2>/dev/null
              local SZ
              SZ=$(wc -c < "$OUT" 2>/dev/null || echo 0)
              echo "  synthesis_size=${SZ}"
              [ "$SZ" -gt 1000 ] && echo "  ✅ OK" && return 0
            fi
            echo "  → 無音フォールバック"
            ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t "$DUR" "$OUT" -loglevel quiet 2>/dev/null
            return 1
          }

          # game.jsonからテキスト生成
          DATE=$(python3 -c "import json; print(json.load(open('game.json'))['date'])")
          vv_synth "${DATE}の高校野球試合結果です" narration/00_open.wav 2

          # 各試合をファイルに書き出してから処理
          python3 -c "
import json
with open('game.json') as f:
    d = json.load(f)
for i, g in enumerate(d['games']):
    win = g['teamA'] if g['scoreA'] > g['scoreB'] else g['teamB']
    text = f\"{g['teamA']} {g['scoreA']}対{g['scoreB']} {g['teamB']}。{win}が勝利。\"
    open(f'/tmp/gt{i}.txt', 'w').write(text)
    print(i)
" | while read -r IDX; do
            TEXT=$(cat "/tmp/gt${IDX}.txt")
            NUM=$(printf '%02d' $((IDX + 1)))
            vv_synth "$TEXT" "narration/${NUM}_game.wav" 4
          done

          vv_synth "チャンネル登録お願いします" narration/99_end.wav 2

          # 結合
          ls narration/*.wav 2>/dev/null | sort | while read -r f; do
            echo "file '$f'"
          done > narration/list.txt
          cat narration/list.txt
          ffmpeg -f concat -safe 0 -i narration/list.txt -c copy narration/combined.wav -y -loglevel quiet 2>/dev/null || \
            ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t 15 narration/combined.wav -loglevel quiet 2>/dev/null
          echo "combined.wav: $(wc -c < narration/combined.wav 2>/dev/null || echo 0) bytes"

      - name: コンポジションHTMLを生成
        run: node scripts/build-composition.js

      - name: Puppeteerで動画レンダリング
        run: node scripts/render-video.js

      - name: BGMをミックス
        run: node scripts/mix-audio.js

      - name: output_final.mp4を確実に生成
        run: |
          if [ ! -f output_final.mp4 ] && [ -f output.mp4 ]; then
            cp output.mp4 output_final.mp4
          fi
          test -f output_final.mp4 || (echo "FATAL: no output_final.mp4" && exit 1)

      - name: YouTube OAuth トークン確認
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/tok.json -w "%{http_code}" -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YOUTUBE_CLIENT_ID}" \
            -d client_secret="${YOUTUBE_CLIENT_SECRET}" \
            -d refresh_token="${YOUTUBE_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)
          [ "$HTTP_CODE" = "200" ] || (cat /tmp/tok.json && exit 1)
          echo "TOKEN OK"

      - name: YouTube Shortsにアップロード
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.js

      - name: 動画をArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: koshien-short
          path: output_final.mp4
          retention-days: 7
